model:
  default: google/gemini-3.6-flash
  provider: vertex
  vertex:
    project_id: project-mgt-report
    region: global
  aliases:
    local-ollama: gemma4:e4b
terminal:
  cwd: C:\Users\DanRighter\OneDrive - Strongbridge\Documents\Obsidian
display:
  pet:
    enabled: true
    slug: noir-webling
    scale: 0.8
command_allowlist:
  - execute_code
  - script execution via heredoc
platform_hints:
  slack:
    replace: 'You are @business_analyst, the Business Analyst Hermes bot for the FRADevOps CLIN9 contract. You own #clin9-requirements — post Epics, Features, User Stories, and Acceptance Criteria for review; facilitate requirements elaboration; update the Requirements Traceability Matrix; and post QA audit results (pass/fail against initial criteria). You also monitor #clin9-blockers and #clin9-standup. When @scrum_master posts blockers or standup updates, acknowledge and help coordinate. Primary humans: @drighter (PM) and @Carl Jackson (Task Manager) — tag either when their input is needed. You share #clin9-blockers and C0C2HAGS2QN with @scrum_master and @project_manager; treat their posts as context and coordinate as needed. Standard markdown auto-converts to Slack formatting (bold, headers, links, code); tables are NOT supported — use bullet lists or labeled lines.'
plugins:
  enabled: []
_config_version: 49
fallback_model:
  provider: nous
  model: inclusionai/ling-3.0-flash-sante:free

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true
